<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Regulars · Check in, mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Figtree:wght@400..700&amp;display=swap">
<style>
body{margin:0;background:#EDEEE6}
a{color:#A8402A}
.btn:active,.ch:active{transform:translateY(1px) scale(.99)}
.ch{transition:background-color .2s ease,border-color .2s ease,color .2s ease}
textarea::placeholder{color:#5F6A63}
:focus-visible{outline:2px solid #A8402A;outline-offset:3px}
@media (prefers-reduced-motion: no-preference){
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.in{animation:rise .8s cubic-bezier(.16,1,.3,1) both}
.swap{animation:rise .55s cubic-bezier(.16,1,.3,1) both}
}
</style>
</helmet>
<div style="width: 390px; min-height: 1250px; box-sizing: border-box; background: #EDEEE6; color: #1B2420; font-family: 'Figtree', 'Helvetica Neue', system-ui, sans-serif">

<header style="padding: 12px 16px; display: flex; align-items: center; justify-content: space-between">
<a href="MobilePlan.dc.html" aria-label="Back to my plan" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1B2420">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
</a>
<svg width="28" height="28" viewBox="0 0 32 32" role="img" aria-label="Regulars"><rect width="32" height="32" rx="7" fill="#A8402A"></rect><path d="M10 26V14.5a6 6 0 0 1 12 0V26z" fill="#F3D3A3"></path></svg>
<span style="width: 44px"></span>
</header>

<main id="main" style="padding: 16px 16px 48px; display: flex; flex-direction: column; gap: 28px">
<div class="in" style="display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0; font-size: 15px; color: #45504A">Tuesday night, your first visit</p>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif; font-weight: 700; font-size: 42px; line-height: 0.98; letter-spacing: -0.04em">How was The Lantern Room?</h1>
</div>

<div role="group" aria-label="How did it go" style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{ choices }}" as="c" hint-placeholder-count="3">
<button type="button" class="ch" aria-pressed="{{ c.pressed }}" onClick="{{ c.pick }}" style="font: inherit; text-align: left; min-height: 72px; padding: 14px 18px; border-radius: 10px; border: 1.5px solid {{ c.border }}; background: {{ c.bg }}; color: {{ c.fg }}; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span style="display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif; font-size: 22px; font-weight: 600; letter-spacing: -0.015em">{{ c.label }}</span>
<span style="font-size: 14px; color: {{ c.sub }}">{{ c.hint }}</span>
</span>
<span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 999px; border: 1.5px solid currentColor; display: flex; align-items: center; justify-content: center; flex: none">
<span style="width: 10px; height: 10px; border-radius: 999px; background: {{ c.dot }}"></span>
</span>
</button>
</sc-for>
</div>

<section aria-live="polite" style="background: #F7F7F2; border: 1px solid #D0D4C6; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
<div class="swap" key="{{ choice }}" style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif; font-weight: 600; font-size: 26px; letter-spacing: -0.02em; line-height: 1.1">{{ title }}</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #2F3934">{{ body }}</p>
</div>
<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="3">
<li style="display: flex; flex-direction: column; gap: 2px; padding: 12px 10px; margin: 0 -10px; border-top: 1px solid #D0D4C6; border-radius: 8px; background: {{ r.bg }}">
<span style="font-size: 13px; font-weight: 600; color: #45504A">{{ r.weeks }}</span>
<span style="font-size: 16px; font-weight: 600">{{ r.place }}</span>
<span style="font-size: 14px; color: {{ r.noteColor }}; font-weight: {{ r.noteWeight }}">{{ r.note }}</span>
</li>
</sc-for>
</ol>
</section>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="m-note" style="font-size: 16px; font-weight: 600">Anything we should know? <span style="font-weight: 400; color: #45504A">Optional</span></label>
<textarea id="m-note" name="note" rows="3" autocomplete="off" placeholder="It was louder than I expected…" style="font: inherit; font-size: 16px; color: #1B2420; background: #F7F7F2; border: 1.5px solid #9EA497; border-radius: 6px; padding: 12px 14px; box-sizing: border-box; width: 100%"></textarea>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<a class="btn" href="MobilePlan.dc.html" style="display: flex; align-items: center; justify-content: center; background: #A8402A; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 17px; padding: 17px 24px; border-radius: 6px; min-height: 52px">Save Check In</a>
<p style="margin: 0; font-size: 14px; color: #45504A; text-align: center">Only your plan changes. Nobody at the venue sees this.</p>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1250}}'>
class Component extends DCLogic {
  renderVals() {
    const choice = (this.state && this.state.choice) || 'back';
    const opts = [
      { id: 'back', label: 'I’d go back', hint: 'Felt right, or close to it' },
      { id: 'okay', label: 'It was okay', hint: 'Not sure yet' },
      { id: 'not', label: 'Not for me', hint: 'Wrong room, wrong crowd' }
    ];
    const choices = opts.map((o) => {
      const on = o.id === choice;
      return { ...o, pressed: on ? 'true' : 'false', bg: on ? '#1B2420' : '#F7F7F2', fg: on ? '#FFFFFF' : '#1B2420', border: on ? '#1B2420' : '#9EA497', sub: on ? '#D6DBD2' : '#45504A', dot: on ? '#F3D3A3' : 'transparent', pick: () => this.setState({ choice: o.id }) };
    });
    const hi = { bg: '#EDEEE6', noteColor: '#A8402A', noteWeight: '700' };
    const lo = { bg: 'transparent', noteColor: '#45504A', noteWeight: '400' };
    const outcomes = {
      back: { title: 'Good. Next Tuesday, same room.', body: 'Going back is the whole point. The reading circle now starts a week earlier.', rows: [
        { weeks: 'Weeks 1 and 2', place: 'The Lantern Room', note: 'Second visit next Tuesday', ...lo },
        { weeks: 'Weeks 3 and 4', place: 'Half Light Records', note: 'Unchanged', ...lo },
        { weeks: 'Weeks 4 to 6', place: 'Common Pages', note: 'Now starts a week earlier', ...hi } ] },
      okay: { title: 'Fair enough. One more try.', body: 'Second visits often feel easier. If it still feels flat, we swap it next week.', rows: [
        { weeks: 'Weeks 1 and 2', place: 'The Lantern Room', note: 'One more visit, then you decide', ...hi },
        { weeks: 'Weeks 3 and 4', place: 'Half Light Records', note: 'Unchanged', ...lo },
        { weeks: 'Weeks 5 and 6', place: 'Common Pages', note: 'Unchanged', ...lo } ] },
      not: { title: 'Thanks for trying it.', body: 'That counts. We swapped it for a calmer room that fits the same taste.', rows: [
        { weeks: 'Weeks 1 and 2', place: 'Kedzie Drawing Table', note: 'New: open drawing night, Tuesdays', ...hi },
        { weeks: 'Weeks 3 and 4', place: 'Half Light Records', note: 'Unchanged', ...lo },
        { weeks: 'Weeks 5 and 6', place: 'Common Pages', note: 'Unchanged', ...lo } ] }
    };
    const o = outcomes[choice];
    return { choices, choice, title: o.title, body: o.body, rows: o.rows };
  }
}
</script>
</body>
</html>
