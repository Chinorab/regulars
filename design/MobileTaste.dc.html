<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Regulars · Your taste, mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Figtree:wght@400..700&amp;display=swap">
<style>
body{margin:0;background:#EDEEE6}
a{color:#A8402A}
.btn:active{transform:translateY(1px)}
:focus-visible{outline:2px solid #A8402A;outline-offset:3px}
@media (prefers-reduced-motion: no-preference){
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.in{animation:rise .85s cubic-bezier(.16,1,.3,1) both}
.d1{animation-delay:.12s}
.tag{animation:rise .7s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(.25s + var(--i) * 70ms)}
}
</style>
</helmet>
<div style="width: 390px; min-height: 1400px; box-sizing: border-box; background: #EDEEE6; color: #1B2420; font-family: 'Figtree', 'Helvetica Neue', system-ui, sans-serif">

<header style="padding: 12px 16px; display: flex; align-items: center; justify-content: space-between">
<a href="MobileIntake.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1B2420">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
</a>
<svg width="28" height="28" viewBox="0 0 32 32" role="img" aria-label="Regulars"><rect width="32" height="32" rx="7" fill="#A8402A"></rect><path d="M10 26V14.5a6 6 0 0 1 12 0V26z" fill="#F3D3A3"></path></svg>
<span style="width: 44px"></span>
</header>

<main id="main" style="padding: 16px 16px 48px; display: flex; flex-direction: column; gap: 36px">
<section style="display: flex; flex-direction: column; gap: 18px">
<p class="in" style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #45504A">Your taste, as we read it</p>
<h1 class="in" style="margin: 0; font-family: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif; font-weight: 600; font-size: 40px; line-height: 1; letter-spacing: -0.035em">You like small rooms where someone is telling the truth.</h1>
<p class="in d1" style="margin: 0; font-size: 17px; line-height: 1.55; color: #2F3934">Songs that sound recorded in one take. Films where two people almost say it. Stories about people who keep showing up.</p>
</section>

<section aria-labelledby="tags">
<h2 id="tags" style="margin: 0 0 12px; font-family: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif; font-weight: 600; font-size: 22px; letter-spacing: -0.015em">What we will look for</h2>
<sc-for list="{{ tags }}" as="t" hint-placeholder-count="8">
<div class="tag" style="--i: {{ $index }}; border-top: 1px solid #C2C6B8; padding: 14px 0 16px; display: flex; gap: 8px; align-items: flex-start; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
<p style="margin: 0; font-family: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif; font-weight: 600; font-size: {{ t.size }}; line-height: 1.08; letter-spacing: -0.02em; color: {{ t.color }}">{{ t.label }}</p>
<p style="margin: 0; font-size: 14px; color: #45504A">{{ t.from }}</p>
</div>
<button type="button" aria-label="{{ t.remove }}" style="flex: none; width: 44px; height: 44px; border: 0; background: transparent; color: #45504A; display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</button>
</div>
</sc-for>
</section>

<div style="display: flex; flex-direction: column; gap: 8px">
<a class="btn" href="MobilePlan.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 12px; background: #A8402A; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 17px; padding: 17px 24px; border-radius: 6px; min-height: 52px">Build My Plan</a>
<a href="MobileIntake.dc.html" style="display: flex; align-items: center; justify-content: center; color: #1B2420; font-size: 16px; font-weight: 500; min-height: 48px">Edit what I love</a>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1400}}'>
class Component extends DCLogic {
  renderVals() {
    const sizes = { l: '27px', m: '23px', s: '20px' };
    const tags = [
      { label: 'Songwriters who tell the truth', from: 'From Big Thief', w: 'l', c: '#A8402A' },
      { label: 'Quiet rooms over loud ones', from: 'From Big Thief and Past Lives', w: 'l', c: '#1B2420' },
      { label: 'Slow, patient films', from: 'From Past Lives', w: 'm', c: '#1B2420' },
      { label: 'Food made with care', from: 'From The Bear', w: 'm', c: '#1B2420' },
      { label: 'Friendship over many years', from: 'From Tomorrow, and Tomorrow, and Tomorrow', w: 'm', c: '#1B2420' },
      { label: 'Made by hand', from: 'From The Bear and Big Thief', w: 's', c: '#1B2420' },
      { label: 'Places with a regular crowd', from: 'From The Bear', w: 's', c: '#1B2420' },
      { label: 'Games and the people who play them', from: 'From Tomorrow, and Tomorrow, and Tomorrow', w: 's', c: '#1B2420' }
    ].map((t) => ({ ...t, size: sizes[t.w], color: t.c, remove: 'Remove ' + t.label }));
    return { tags };
  }
}
</script>
</body>
</html>
